name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Verify tag matches project version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/OctetLedger.Cli/OctetLedger.Cli.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($projectVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match project version $projectVersion."
          }

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format OctetLedger.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-latest
            architecture: X64
          - runtime: win-arm64
            runner: windows-11-arm
            architecture: ARM64
    runs-on: ${{ matrix.runner }}
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate signing configuration
        shell: pwsh
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)
          if ($hasCertificate -xor $hasPassword) {
            throw 'Both WINDOWS_SIGNING_CERTIFICATE_BASE64 and WINDOWS_SIGNING_CERTIFICATE_PASSWORD must be configured together.'
          }
          if (-not $hasCertificate) {
            Write-Warning 'No Authenticode certificate is configured; this release executable will be unsigned.'
          }

      - name: Publish Windows executable
        run: >-
          dotnet publish src/OctetLedger.Cli/OctetLedger.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output artifacts/${{ matrix.runtime }}

      - name: Sign executable when release certificate is configured
        if: ${{ env.SIGNING_CERTIFICATE_BASE64 != '' && env.SIGNING_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'octetledger-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
            & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD `
              /tr https://timestamp.digicert.com /td SHA256 "artifacts/${{ matrix.runtime }}/octetledger.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE." }
            & $signTool.FullName verify /pa /v "artifacts/${{ matrix.runtime }}/octetledger.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE." }
          }
          finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test native executable
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne '${{ matrix.architecture }}') {
            throw "Expected ${{ matrix.architecture }} runner, got $env:RUNNER_ARCH."
          }
          & "artifacts/${{ matrix.runtime }}/octetledger.exe" version

      - name: Build installation package
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Runtime '${{ matrix.runtime }}'

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.runtime }}
          path: artifacts/packages/*

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: artifacts/packages
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/packages/*.zip
          artifacts/packages/*.sha256
          --notes "Detailed release notes: https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/CHANGELOG.md"
          --generate-notes
          --verify-tag
