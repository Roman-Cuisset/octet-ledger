name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        shell: pwsh
        run: |
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet test --configuration Release --no-build

      - name: Publish Windows executable
        run: >-
          dotnet publish src/OctetLedger.Cli/OctetLedger.Cli.csproj
          --configuration Release
          --runtime ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output artifacts/${{ matrix.runtime }}

      - name: Sign executable when release certificate is configured
        if: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'octetledger-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($null -eq $signTool) { throw 'signtool.exe was not found.' }
          & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 "artifacts/${{ matrix.runtime }}/octetledger.exe"
          & $signTool.FullName verify /pa /v "artifacts/${{ matrix.runtime }}/octetledger.exe"
          Remove-Item -LiteralPath $certificatePath -Force

      - name: Build installation package
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Runtime '${{ matrix.runtime }}'

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.runtime }}
          path: artifacts/packages/*

  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: package-*
          path: artifacts/packages
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/packages/*.zip
          artifacts/packages/*.sha256
          --generate-notes
          --verify-tag
