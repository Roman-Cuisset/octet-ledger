name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Verify formatting
        run: dotnet format OctetLedger.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Publish Windows executable
        run: >-
          dotnet publish src/OctetLedger.Cli/OctetLedger.Cli.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output artifacts/win-x64

      - name: Smoke test executable
        shell: pwsh
        run: .\artifacts\win-x64\octetledger.exe version

      - name: Build installation package
        shell: pwsh
        run: .\scripts\package.ps1 -Version ci

      - name: Test install, update, rollback, and crash recovery
        shell: pwsh
        run: .\scripts\test-install-lifecycle.ps1 -PackagePath .\artifacts\packages\OctetLedger-ci-win-x64.zip

  arm64:
    runs-on: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish native ARM64 executable
        run: >-
          dotnet publish src/OctetLedger.Cli/OctetLedger.Cli.csproj
          --configuration Release
          --runtime win-arm64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          --output artifacts/win-arm64

      - name: Smoke test native ARM64 executable
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw "Expected an ARM64 runner, got $env:RUNNER_ARCH." }
          .\artifacts\win-arm64\octetledger.exe version

      - name: Build ARM64 installation package
        shell: pwsh
        run: .\scripts\package.ps1 -Version ci -Runtime win-arm64
